/* ============ WhatsApp text parser ============ */
function parseWhatsAppText(raw) {
  const lines = raw.split(/\r?\n/)
    .map(l => l.replace(/^\[?\d{1,2}\/\d{1,2}\/\d{2,4},?\s?\d{1,2}:\d{2}.*?\]?\s?-?\s?.*?:\s?/i, ""))
    .map(l => l.trim())
    .filter(l => l.length > 0 && !/^(good morning|gm|please do|regards|thank you|thanks)$/i.test(l));
  const items = [];
  for (const line of lines) {
    const match = line.match(/^([A-Za-z][A-Za-z .]{1,20}?)\s*[:\-–]\s*(.+)$/);
    if (match) {
      const rawSubject = match[1].trim();
      const found = KNOWN_SUBJECTS.find(s =>
        s.toLowerCase() === rawSubject.toLowerCase() ||
        (s === "SST" && /social/i.test(rawSubject)) ||
        (s === "Maths" && /math/i.test(rawSubject))
      );
      items.push({ subject: found || "General", text: match[2].trim() });
    } else {
      items.push({ subject: "General", text: line });
    }
  }
  return items;
}

  if (type.startsWith("image/")) return "image";
  if (/\.(xlsx|xls|csv)$/i.test(name)) return "excel";
  if (/\.(doc|docx)$/i.test(name)) return "doc";
  if (/\.pdf$/i.test(name)) return "pdf";
  return "file";
}

/* ============ Add to Home Screen ============ */
function InstallButton() {
  const [deferredPrompt, setDeferredPrompt] = useState(null);
  const [installed, setInstalled] = useState(false);
  const [showIOSHelp, setShowIOSHelp] = useState(false);
  const isIOS = typeof navigator !== "undefined" && /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream;
  const isStandalone = typeof window !== "undefined" &&
    (window.matchMedia?.("(display-mode: standalone)").matches || window.navigator.standalone === true);

  useEffect(() => {
    const onPrompt = (e) => { e.preventDefault(); setDeferredPrompt(e); };
    const onInstalled = () => { setInstalled(true); setDeferredPrompt(null); };
    window.addEventListener("beforeinstallprompt", onPrompt);
    window.addEventListener("appinstalled", onInstalled);
    return () => {
      window.removeEventListener("beforeinstallprompt", onPrompt);
      window.removeEventListener("appinstalled", onInstalled);
    };
  }, []);

  if (isStandalone || installed) return null;
  if (!deferredPrompt && !isIOS) return null; // nothing to offer on this browser

  const handleClick = async () => {
    if (deferredPrompt) {
      deferredPrompt.prompt();
      const choice = await deferredPrompt.userChoice;
      if (choice.outcome === "accepted") setInstalled(true);
      setDeferredPrompt(null);
    } else if (isIOS) {
      setShowIOSHelp(true);
    }
  };

  return (
    <>
      <button onClick={handleClick} className="w-10 h-10 rounded-full bg-white/70 flex items-center justify-center active:scale-90 transition" aria-label="Add to Home Screen">
        <Icon.download size={18} color={NAVY} />
      </button>
      {showIOSHelp && (
        <Sheet onClose={() => setShowIOSHelp(false)} title="Add to Home Screen">
          <p className="text-sm mb-3" style={{ color: INK }}>Install Kavi &amp; Magi on your iPhone/iPad so it opens like an app:</p>

            <li>Scroll down and tap <strong>Add to Home Screen</strong>.</li>
            <li>Tap <strong>Add</strong> in the top-right corner.</li>
          </ol>
        </Sheet>
      )}
    </>
  );
}

/* ============================================================
   ROOT — decides Supabase vs local-only, then family-code gate
   ============================================================ */
function Root() {
  const [authReady, setAuthReady] = useState(!SUPABASE_READY);
  const [familyCode, setFamilyCode] = useState(() => localLoad("familyCode", null));

  useEffect(() => {
    if (!SUPABASE_READY) return;
    (async () => {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) {
        const { error } = await sb.auth.signInAnonymously();
        if (error) console.error("Anonymous sign-in failed:", error);
      }
      setAuthReady(true);
    })();
  }, []);

  if (!authReady) {
    return <CenterLoading text="Connecting…" />;
  }

  if (SUPABASE_READY && !familyCode) {
    return <FamilyCodeGate onReady={(code) => { localSave("familyCode", code); setFamilyCode(code); }} />;
  }

  return <App familyCode={SUPABASE_READY ? familyCode : null}
              onChangeFamily={SUPABASE_READY ? () => { localSave("familyCode", null); setFamilyCode(null); } : null} />;
}

}

function FamilyCodeGate({ onReady }) {
  const [mode, setMode] = useState(null); // 'create' | 'join'
  const [inputCode, setInputCode] = useState("");
  const [newCode] = useState(() => randomFamilyCode());
  const [creating, setCreating] = useState(false);
  const [error, setError] = useState("");

  const createFamily = async () => {
    setCreating(true);
    try {
      const { error } = await sb.from("families").insert({ code: newCode, profiles: [], entries: {} });
      if (error) throw error;
      onReady(newCode);
    } catch (e) { console.error("Create family failed:", e); setError(`Could not create family — ${e.message || "check your Supabase setup"}.`); setCreating(false); }
  };

  const joinFamily = async () => {
    const code = inputCode.trim().toUpperCase();
    if (code.length < 4) { setError("Enter the 6-character code from the other device."); return; }
    setCreating(true);
    try {
      const { data, error } = await sb.from("families").select("code").eq("code", code).maybeSingle();
      if (error) throw error;
      if (!data) { setError("No family found with that code. Check it and try again."); setCreating(false); return; }
      onReady(code);
    } catch (e) { console.error("Join family failed:", e); setError(`Something went wrong — ${e.message || "check your connection and try again"}.`); setCreating(false); }
  };

  return (
    <div className="min-h-screen flex items-center justify-center px-4" style={{ background: PAPER }}>
      <div className="bg-white rounded-2xl p-6 max-w-sm w-full" style={{ border: `1px solid ${LINE}` }}>
        <div className="flex justify-center mb-4"><Emblem size={56} /></div>
        <h1 className="font-display font-bold text-lg text-center mb-1" style={{ color: NAVY }}>Kavi &amp; Magi School Diary</h1>
        <p className="text-sm text-center mb-5" style={{ color: MUTED }}>
          Set up once, then open the same diary from any device.
        </p>

        {!mode && (
          <div className="flex flex-col gap-2.5">
            <button onClick={() => setMode("create")} className="w-full py-3.5 rounded-xl text-white font-display font-bold" style={{ background: NAVY }}>
              Start a new diary
            </button>
            <button onClick={() => setMode("join")} className="w-full py-3.5 rounded-xl font-display font-bold" style={{ background: "#E1F3EC", color: TEAL_DARK }}>
              I already have a family code
            </button>
          </div>
        )}

        {mode === "create" && (
          <div>
            <p className="text-xs mb-2" style={{ color: MUTED }}>This code links your devices together. Write it down or share it with the other device/phone:</p>
            <div className="text-center py-4 rounded-xl mb-4 font-display font-extrabold text-3xl tracking-[0.2em]" style={{ background: "#E1F3EC", color: TEAL_DARK }}>
              {newCode}
            </div>
            {error && <p className="text-xs mb-3" style={{ color: "#B7551E" }}>{error}</p>}
            <button disabled={creating} onClick={createFamily} className="w-full py-3.5 rounded-xl text-white font-display font-bold disabled:opacity-50" style={{ background: NAVY }}>
              {creating ? "Setting up…" : "Continue"}
            </button>
            <button onClick={() => { setMode(null); setError(""); }} className="w-full py-2 mt-2 text-xs font-bold" style={{ color: MUTED }}>Back</button>
          </div>
        )}

        {mode === "join" && (
          <div>
            <label className="text-xs font-bold mb-1.5 block uppercase tracking-wide" style={{ color: MUTED }}>Family code</label>
            <input value={inputCode} onChange={(e) => setInputCode(e.target.value.toUpperCase())} placeholder="e.g. K7M2XQ" maxLength={6}
              className="w-full rounded-xl p-3 text-center font-display font-bold text-xl tracking-[0.2em] mb-3 focus:outline-none" style={{ border: `2px solid ${LINE}` }} />
            {error && <p className="text-xs mb-3" style={{ color: "#B7551E" }}>{error}</p>}
            <button disabled={creating} onClick={joinFamily} className="w-full py-3.5 rounded-xl text-white font-display font-bold disabled:opacity-50" style={{ background: NAVY }}>
              {creating ? "Connecting…" : "Connect"}
            </button>
            <button onClick={() => { setMode(null); setError(""); }} className="w-full py-2 mt-2 text-xs font-bold" style={{ color: MUTED }}>Back</button>
          </div>
        )}
      </div>
    </div>
  );
}

function App({ familyCode, onChangeFamily }) {
  const [tab, setTab] = useState("home");
  const [profiles, setProfiles] = useState(() => familyCode ? [] : localLoad("profiles", []));
  const [entriesByProfile, setEntriesByProfile] = useState(() => familyCode ? {} : localLoad("entries", {}));
  const [commonDocs, setCommonDocs] = useState(() => familyCode ? [] : localLoad("commonDocs", []));
  const [activeProfileId, setActiveProfileId] = useState(() => localLoad("activeProfileId", null));
  const [loaded, setLoaded] = useState(!familyCode);
  const [syncing, setSyncing] = useState(!!familyCode);
  const [selectedDate, setSelectedDate] = useState(todayKey());
  const [showAdd, setShowAdd] = useState(false);
  const [showImport, setShowImport] = useState(false);
  const [showAddDoc, setShowAddDoc] = useState(false);
  const [showProfileForm, setShowProfileForm] = useState(false);
  const [showProfileSwitcher, setShowProfileSwitcher] = useState(false);
  const [editingProfile, setEditingProfile] = useState(null);

  /* --- Supabase sync (fetch on load, then poll every 5s to pick up changes from other devices) --- */
  const fetchFamily = useCallback(async () => {
    if (!familyCode) return;
    const { data, error } = await sb.from("families").select("profiles, entries, common_docs").eq("code", familyCode).maybeSingle();
    if (error) { console.error("Fetch family failed:", error); setLoaded(true); setSyncing(false); return; }
    if (data) {
      setProfiles(data.profiles || []);
      setEntriesByProfile(data.entries || {});
      setCommonDocs(data.common_docs || []);
      if ((data.profiles || []).length === 0) setShowProfileForm(true);
    }
    setLoaded(true);
    setSyncing(false);
  }, [familyCode]);

  useEffect(() => {
    if (!familyCode) return;
    fetchFamily();
    const interval = setInterval(fetchFamily, 5000);
    return () => clearInterval(interval);
  }, [familyCode, fetchFamily]);

  useEffect(() => {
    if (!familyCode && profiles.length === 0) setShowProfileForm(true);
  }, [familyCode]); // eslint-disable-line

  useEffect(() => { localSave("activeProfileId", activeProfileId); }, [activeProfileId]);
  useEffect(() => {
    if (profiles.length === 0) return;
    const stillValid = profiles.some(p => p.id === activeProfileId);
    if (!activeProfileId || !stillValid) setActiveProfileId(profiles[0].id);
  }, [profiles, activeProfileId]);

  const persist = useCallback(async (nextProfiles, nextEntries) => {
    if (familyCode) {
      // Update local state immediately so the UI feels instant; the write
      // happens in the background and the next poll reconciles either way.
      setProfiles(nextProfiles);
      setEntriesByProfile(nextEntries);
      setSyncing(true);
      try {
        const { error } = await sb.from("families")
          .update({ profiles: nextProfiles, entries: nextEntries, updated_at: new Date().toISOString() })
          .eq("code", familyCode);
        if (error) throw error;
      } catch (e) { console.error("Save failed:", e); }
      setSyncing(false);
    } else {
      localSave("profiles", nextProfiles);
      localSave("entries", nextEntries);
      setProfiles(nextProfiles);
      setEntriesByProfile(nextEntries);
    }
  }, [familyCode]);

  const persistDocs = useCallback(async (nextDocs) => {
    if (familyCode) {
      setCommonDocs(nextDocs);
      setSyncing(true);
      try {
        const { error } = await sb.from("families")
          .update({ common_docs: nextDocs, updated_at: new Date().toISOString() })
          .eq("code", familyCode);
        if (error) throw error;
      } catch (e) { console.error("Save doc failed:", e); }
      setSyncing(false);
    } else {
      localSave("commonDocs", nextDocs);
      setCommonDocs(nextDocs);
    }
  }, [familyCode]);
  const activeProfile = profiles.find(p => p.id === activeProfileId) || null;
  const dayData = (entriesByProfile[activeProfileId] && entriesByProfile[activeProfileId][selectedDate]) || { tasks: [] };

  const addTasks = (newTasks, dateKey = selectedDate) => {
    if (!activeProfileId) return;
    const profileEntries = entriesByProfile[activeProfileId] || {};
    const existing = profileEntries[dateKey] || { tasks: [] };
    const nextEntries = {
      ...entriesByProfile,
      [activeProfileId]: { ...profileEntries, [dateKey]: { ...existing, tasks: [...existing.tasks, ...newTasks] } },
    };
    persist(profiles, nextEntries);
  };
  const toggleTask = (dateKey, id) => {
    const profileEntries = entriesByProfile[activeProfileId]; if (!profileEntries || !profileEntries[dateKey]) return;
    const tasks = profileEntries[dateKey].tasks.map(t => t.id === id ? { ...t, done: !t.done } : t);
    const nextEntries = { ...entriesByProfile, [activeProfileId]: { ...profileEntries, [dateKey]: { ...profileEntries[dateKey], tasks } } };
    persist(profiles, nextEntries);
  };
  const deleteTask = (dateKey, id) => {
    const profileEntries = entriesByProfile[activeProfileId]; if (!profileEntries || !profileEntries[dateKey]) return;
    const tasks = profileEntries[dateKey].tasks.filter(t => t.id !== id);
    const nextEntries = { ...entriesByProfile, [activeProfileId]: { ...profileEntries, [dateKey]: { ...profileEntries[dateKey], tasks } } };
    persist(profiles, nextEntries);
  };
  const saveProfile = (p) => {
    let next;
    if (editingProfile) {
      next = profiles.map(pr => pr.id === editingProfile.id ? { ...pr, ...p } : pr);
    } else {
      const newProfile = { id: uid(), color: PROFILE_COLORS[profiles.length % PROFILE_COLORS.length], ...p };
      next = [...profiles, newProfile];
      setActiveProfileId(newProfile.id);
    }
    persist(next, entriesByProfile);
    setShowProfileForm(false); setEditingProfile(null);
  };

  const historyDates = useMemo(() => {
    const profileEntries = entriesByProfile[activeProfileId] || {};
    return Object.keys(profileEntries).filter(k => (profileEntries[k].tasks || []).length > 0).sort((a, b) => (a < b ? 1 : -1));
  }, [entriesByProfile, activeProfileId]);

  if (!loaded) return <CenterLoading text="Loading your diary…" />;

  if (profiles.length > 0 && !activeProfile) return <CenterLoading text="Loading profile…" />;

  return (
    <div className="min-h-screen flex flex-col" style={{ background: PAPER, color: INK }}>
      {tab !== "home" && (
        <header className="sticky top-0 z-20 px-4 pt-5 pb-4" style={{ background: `linear-gradient(135deg, ${NAVY} 0%, ${NAVY_SOFT} 100%)` }}>
          <div className="max-w-xl mx-auto flex items-center justify-between mb-3">
            <div className="flex items-center gap-3">
              <Emblem />
              <div>
                <p className="text-[10px] uppercase tracking-[0.18em] font-bold" style={{ color: "#8FB8CE" }}>Kavi &amp; Magi</p>
                <h1 className="font-display font-bold text-lg leading-tight text-white -mt-0.5">
                  {activeProfile ? `Hi, ${activeProfile.name.split(" ")[0]}` : "School Diary"}
                </h1>
              </div>
            </div>
            <div className="flex items-center gap-2">
              {familyCode && (
                <span className="text-[10px] font-bold px-2 py-1 rounded-full flex items-center gap-1" style={{ background: "rgba(255,255,255,0.12)", color: syncing ? "#F5D08A" : "#8FE3C9" }}>
                  <Icon.cloud size={11} /> {syncing ? "Syncing…" : "Synced"}
                </span>
              )}
              <button onClick={() => setShowProfileSwitcher(true)} className="active:scale-90 transition" aria-label="Switch profile">
                {activeProfile ? <Avatar name={activeProfile.name} color={activeProfile.color} size={38} ring /> : <div className="w-10 h-10 rounded-full flex items-center justify-center" style={{ background: "rgba(255,255,255,0.12)" }}><Icon.user size={18} color="#fff" /></div>}
              </button>
            </div>
          </div>
          {activeProfile && (
            <div className="max-w-xl mx-auto flex items-center gap-2">
              <span className="text-[11px] font-semibold px-2.5 py-1 rounded-full" style={{ background: "rgba(255,255,255,0.12)", color: "#CFE3EC" }}>
                Class {activeProfile.className}{activeProfile.section ? `-${activeProfile.section}` : ""}
              </span>
              {profiles.length > 1 && (
                <button onClick={() => setShowProfileSwitcher(true)} className="text-[11px] font-bold flex items-center gap-1" style={{ color: "#8FE3C9" }}>
                  <Icon.swap size={12} /> Switch student
                </button>
              )}
            </div>
          )}
        </header>
      )}

      <main className={`flex-1 overflow-y-auto pb-28 max-w-xl w-full mx-auto ${tab === "home" ? "" : "px-4 pt-5"}`}>
        {tab === "home" && (
          <HomeView profiles={profiles} entriesByProfile={entriesByProfile}
            onOpenProfile={(id) => { setActiveProfileId(id); setTab("today"); }}
            onGoDiary={() => setTab("diary")} onImport={() => setShowImport(true)}
            onMenu={() => setShowProfileSwitcher(true)} onBell={() => setTab("today")} />
        )}
        {tab === "today" && (
          <TodayView selectedDate={selectedDate} setSelectedDate={setSelectedDate} dayData={dayData} historyDates={historyDates}
            onToggle={(id) => toggleTask(selectedDate, id)} onDelete={(id) => deleteTask(selectedDate, id)}
            onAdd={() => setShowAdd(true)} onImport={() => setShowImport(true)} familyCode={familyCode} activeProfileId={activeProfileId} />
        )}
        {tab === "diary" && (
          <DiaryView historyDates={historyDates} entries={entriesByProfile[activeProfileId] || {}} onOpen={(k) => { setSelectedDate(k); setTab("today"); }} />
        )}
        {tab === "docs" && (
          <DocsView docs={commonDocs} onAdd={() => setShowAddDoc(true)}
            onDelete={(id) => persistDocs(commonDocs.filter(d => d.id !== id))} />
        )}
      </main>

      <nav className="fixed bottom-0 inset-x-0 z-20 bg-white px-6" style={{ borderTop: `1px solid ${LINE}`, boxShadow: "0 -4px 16px rgba(15,46,76,0.06)" }}>
        <div className="max-w-xl mx-auto flex justify-around py-2.5">
          <NavBtn icon={<Icon.home size={20} />} label="Home" active={tab === "home"} onClick={() => setTab("home")} bg="#CFE6F9" fg={NAVY_SOFT} />
          <NavBtn icon={<Icon.book size={20} />} label="Today" active={tab === "today"} onClick={() => setTab("today")} bg="#CDEEDC" fg={TEAL_DARK} />
          <NavBtn icon={<Icon.calendar size={20} />} label="Diary" active={tab === "diary"} onClick={() => setTab("diary")} bg="#FBEAC0" fg="#8A6300" />
          <NavBtn icon={<Icon.folder size={20} />} label="Docs" active={tab === "docs"} onClick={() => setTab("docs")} bg="#E2D9F8" fg="#5A3F94" />
        </div>
      </nav>

      {tab === "today" && activeProfile && (
        <button onClick={() => setShowAdd(true)}
          className="fixed bottom-24 right-5 z-30 w-14 h-14 rounded-full text-white flex items-center justify-center active:scale-90 transition"
          style={{ background: `linear-gradient(135deg, ${TEAL}, ${TEAL_DARK})`, boxShadow: "0 6px 16px rgba(30,143,115,0.4)" }} aria-label="Add task">
          <Icon.plus size={24} />
        </button>
      )}
      {tab === "docs" && (
        <button onClick={() => setShowAddDoc(true)}
          className="fixed bottom-24 right-5 z-30 w-14 h-14 rounded-full text-white flex items-center justify-center active:scale-90 transition"
          style={{ background: `linear-gradient(135deg, ${TEAL}, ${TEAL_DARK})`, boxShadow: "0 6px 16px rgba(30,143,115,0.4)" }} aria-label="Add document">
          <Icon.plus size={24} />
        </button>
      )}

      {showAdd && <AddTaskSheet onClose={() => setShowAdd(false)} onSave={(task) => { addTasks([task]); setShowAdd(false); }} familyCode={familyCode} activeProfileId={activeProfileId} />}
      {showImport && <ImportSheet onClose={() => setShowImport(false)}
        onConfirm={(tasks, dateKey) => { addTasks(tasks, dateKey); setShowImport(false); setSelectedDate(dateKey); setTab("today"); }}
        defaultDate={selectedDate} />}
      {showAddDoc && <AddDocSheet onClose={() => setShowAddDoc(false)} familyCode={familyCode}
        onSave={(doc) => { persistDocs([...commonDocs, doc]); setShowAddDoc(false); }} />}
      {showProfileForm && (
        <ProfileSheet profile={editingProfile} onClose={() => { if (profiles.length > 0) { setShowProfileForm(false); setEditingProfile(null); } }}
          dismissable={profiles.length > 0} onSave={saveProfile} />
      )}
      {showProfileSwitcher && (
        <ProfileSwitcherSheet profiles={profiles} activeProfileId={activeProfileId}
          onSelect={(id) => { setActiveProfileId(id); setShowProfileSwitcher(false); }}
          onAdd={() => { setEditingProfile(null); setShowProfileSwitcher(false); setShowProfileForm(true); }}
          onEdit={(p) => { setEditingProfile(p); setShowProfileSwitcher(false); setShowProfileForm(true); }}
          onClose={() => setShowProfileSwitcher(false)}
          familyCode={familyCode} onChangeFamily={onChangeFamily} />
      )}
    </div>
  );
}

/* ============ Attachment upload + display ============ */
function AttachmentPicker({ familyCode, activeProfileId, attachment, onChange }) {
  const [uploading, setUploading] = useState(false);
  const [error, setError] = useState("");
  const inputRef = useRef(null);

  const handleFile = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    setError("");
    if (file.size > MAX_FILE_MB * 1024 * 1024) { setError(`File is too big (max ${MAX_FILE_MB}MB).`); return; }

    if (!familyCode) {
      setError("Attachments need cloud sync to be set up (Supabase). This device is running in local-only mode.");
      return;
    }
    setUploading(true);
    try {
      const path = `${familyCode}/${activeProfileId}/${uid()}-${file.name}`;
      const { error: uploadError } = await sb.storage.from(ATTACHMENTS_BUCKET).upload(path, file);
      if (uploadError) throw uploadError;
      const { data } = sb.storage.from(ATTACHMENTS_BUCKET).getPublicUrl(path);
      onChange({ name: file.name, url: data.publicUrl, type: file.type, size: file.size, kind: fileKind(file.type, file.name) });
    } catch (err) {
      console.error("Attachment upload failed:", err);
      setError(`Upload failed — ${err.message || "check your Supabase Storage setup"}.`);
    }
    setUploading(false);
  };

  if (attachment) {
    return (
      <div className="flex items-center gap-2 p-2.5 rounded-xl mb-4" style={{ background: fileBadgeColor(attachment.kind), border: `1px solid ${LINE}` }}>
        <span className="text-[10px] font-extrabold px-2 py-1 rounded-md bg-white shrink-0">{fileBadgeLabel(attachment.kind)}</span>
        <span className="text-xs flex-1 truncate" style={{ color: INK }}>{attachment.name}</span>
        <button onClick={() => onChange(null)} className="shrink-0"><Icon.x size={14} color={MUTED} /></button>
      </div>
    );
  }

  return (
    <div className="mb-4">
      <input ref={inputRef} type="file" accept={ACCEPTED_FILE_TYPES} onChange={handleFile} className="hidden" />
      <button onClick={() => inputRef.current?.click()} disabled={uploading}
        className="w-full py-2.5 rounded-xl text-sm font-bold flex items-center justify-center gap-2 disabled:opacity-50"
        style={{ background: "#F5F8F8", color: NAVY, border: `1.5px dashed ${LINE}` }}>
        <Icon.paperclip size={15} /> {uploading ? "Uploading…" : "Attach photo, PDF, Word or Excel file"}
      </button>
      {error && <p className="text-[11px] mt-1.5" style={{ color: "#B7551E" }}>{error}</p>}
    </div>
  );
}

function AttachmentChip({ attachment }) {
  const [downloading, setDownloading] = useState(false);
  if (!attachment) return null;

  const handleView = () => {
    // Opens in a new tab. For images/PDFs the browser previews inline;
    // for Word/Excel files the browser will download it and the device's
    // own "Open with…" app chooser takes over from there — that's normal
    // OS behavior for file types browsers can't render themselves.
    window.open(attachment.url, "_blank", "noopener,noreferrer");
  };

  const handleDownload = async () => {
    setDownloading(true);
    try {
      // Fetch as a blob so we can force a real download with the original
      // filename, rather than just navigating to the URL.
      const res = await fetch(attachment.url);
      const blob = await res.blob();
      const blobUrl = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = blobUrl;
      a.download = attachment.name;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(blobUrl), 4000);
    } catch (e) {
      console.error("Download failed, falling back to direct link:", e);
      window.open(attachment.url, "_blank", "noopener,noreferrer");
    }
    setDownloading(false);
  };

  return (
    <div className="flex items-center gap-2 mt-1.5 flex-wrap">
      <span className="inline-flex items-center gap-1 text-[11px] font-bold px-2 py-1 rounded-md" style={{ background: fileBadgeColor(attachment.kind), color: INK }}>
        <Icon.paperclip size={11} /> {attachment.name}
      </span>
      <button onClick={handleView} className="text-xs font-bold px-3.5 py-2 rounded-lg transition active:scale-95" style={{ background: NAVY_SOFT, color: "#fff" }}>
        View
      </button>
      <button onClick={handleDownload} disabled={downloading} className="text-xs font-bold px-3.5 py-2 rounded-lg disabled:opacity-50 transition active:scale-95" style={{ background: NAVY_SOFT, color: "#fff" }}>
        {downloading ? "Downloading…" : "Download"}
      </button>
    </div>
  );
}

function computeStreak(profileEntries) {
  let streak = 0;
  let cursor = todayKey();
  while (true) {
    const day = (profileEntries || {})[cursor];
    if (day && day.tasks && day.tasks.length > 0 && day.tasks.every(t => t.done)) {
      streak++;
      cursor = addDays(cursor, -1);
    } else break;
  }
  return streak;
}
function computeEverCompleted(profileEntries) {
  return Object.values(profileEntries || {}).some(d => (d.tasks || []).some(t => t.done));
}

  Sanskrit: "📜", Computer: "💻", GK: "🧠", Art: "🎨", PE: "⚽", General: "📌",
};

function StudentBoard({ profile, dayData, onOpen }) {
  const tasks = dayData.tasks || [];
  const doneCount = tasks.filter(t => t.done).length;
  return (
    <button onClick={onOpen} className="rounded-2xl p-4 text-left w-full transition hover:shadow-md active:scale-[0.99]"
      style={{ background: "#EAF6FC", border: `1px solid #D3ECF7` }}>
      <div className="flex items-center justify-between mb-3">
        <div className="flex items-center gap-2.5">
          <Avatar name={profile.name} color={profile.color} size={34} />
          <p className="font-display font-extrabold text-sm" style={{ color: INK }}>{profile.name}'s Board</p>
        </div>
        <span className="text-[11px] font-bold px-2 py-1 rounded-full" style={{ background: "#fff", color: NAVY_SOFT }}>{doneCount}/{tasks.length}</span>
      </div>
      {tasks.length === 0 ? (
        <p className="text-xs py-5 text-center" style={{ color: MUTED }}>Nothing logged yet today.</p>
      ) : (
        <ul className="space-y-2">
          {tasks.slice(0, 4).map(t => (
            <li key={t.id} className="flex items-center gap-2.5 rounded-xl p-2.5 relative overflow-hidden" style={{ background: t.done ? "#DCF3E4" : "#fff" }}>
              <span className="w-9 h-9 rounded-lg flex items-center justify-center text-base shrink-0" style={{ background: styleFor(t.subject).bg }}>
                {SUBJECT_EMOJI[t.subject] || "📌"}
              </span>
              <div className="flex-1 min-w-0">
                <p className={`text-xs font-semibold truncate ${t.done ? "line-through" : ""}`} style={{ color: t.done ? "#5F8C72" : INK }}>{t.text}</p>
                <span className="inline-block text-[9px] font-bold px-1.5 py-0.5 rounded-full mt-0.5" style={{ background: t.done ? "#35C48A" : "#FFB648", color: "#fff" }}>
                  {t.done ? "Done" : "Pending"}
                </span>
              </div>
              {t.done && <span className="text-base shrink-0">🎉</span>}
            </li>
          ))}
        </ul>
      )}
      {tasks.length > 4 && <p className="text-[11px] mt-2 text-center" style={{ color: MUTED }}>+{tasks.length - 4} more</p>}
    </button>
  );
}

function HomeView({ profiles, entriesByProfile, onOpenProfile, onGoDiary, onImport, onMenu, onBell }) {
  const today = todayKey();

  const stats = profiles.map(p => {
    const profileEntries = entriesByProfile[p.id] || {};
    const todayTasks = (profileEntries[today] || {}).tasks || [];
    const todayDone = todayTasks.filter(t => t.done).length;
    return {
      profile: p,
      todayTotal: todayTasks.length,
      todayDone,
      streak: computeStreak(profileEntries),
      everDone: computeEverCompleted(profileEntries),
      dayData: profileEntries[today] || { tasks: [] },
    };
  });

  const names = profiles.map(p => p.name.split(" ")[0]);
  const greetingNames = names.length > 1 ? `${names.slice(0, -1).join(", ")} & ${names[names.length - 1]}` : (names[0] || "");
  const pendingCount = stats.reduce((sum, s) => sum + (s.todayTotal - s.todayDone), 0);
  const bestStreak = stats.reduce((max, s) => Math.max(max, s.streak), 0);
  const starsCollected = stats.reduce((sum, s) => sum + BADGES.filter(b => b.test(s)).length, 0);

  const outlinedTitle = {
    WebkitTextStroke: "1.5px white",
    textShadow: "2px 0 white,-2px 0 white,0 2px white,0 -2px white,2px 2px white,-2px -2px white,2px -2px white,-2px 2px white",

    <div className="relative overflow-hidden" style={{ background: "linear-gradient(180deg, #BEE7F5 0%, #DCF3FA 55%, #FFF9EC 100%)" }}>
      <KidsBackdrop />
      {/* Sky header */}
      <div className="relative z-10 px-4 pt-6 pb-5">
        <div className="max-w-xl mx-auto flex items-center justify-between mb-4">
          <button onClick={onMenu} className="w-10 h-10 rounded-full bg-white/70 flex items-center justify-center active:scale-90 transition" aria-label="Menu">
            <Icon.menu size={19} color={NAVY} />
          </button>
          <div className="flex items-center gap-2">
            <InstallButton />
            <button onClick={onBell} className="w-10 h-10 rounded-full bg-white/70 flex items-center justify-center active:scale-90 transition relative" aria-label="Reminders">
              <Icon.bell size={19} color={NAVY} />
              {pendingCount > 0 && (
                <span className="absolute -top-0.5 -right-0.5 w-3.5 h-3.5 rounded-full bg-[#FF6B6B] border-2 border-[#DCF3FA]" />
              )}
            </button>
          </div>
        </div>
        <div className="max-w-xl mx-auto text-center">
          <h1 className="font-display font-extrabold text-2xl leading-tight" style={{ color: NAVY, ...outlinedTitle }}>
            KAVI &amp; MAGI
          </h1>
          <p className="font-display font-extrabold text-sm -mt-1" style={{ color: TEAL_DARK, ...outlinedTitle }}>SCHOOL DIARY</p>

          {/* Mascot art, right under the logo */}
          <div className="flex justify-center mt-1 -mb-1">
            <img src="mascots.png" alt="" className="h-24 w-auto object-contain select-none pointer-events-none drop-shadow-lg" draggable="false" />
          </div>

          <p className="font-display font-bold text-lg mt-2" style={{ color: INK }}>

const WEEKDAY_LABELS = ["S", "M", "T", "W", "T", "F", "S"];
const MONTH_LABEL_FMT = (y, m) => new Date(y, m, 1).toLocaleDateString("en-IN", { month: "long", year: "numeric" });

function DatePickerSheet({ selectedDate, historyDates = [], onClose, onSelect }) {
  const sel = new Date(selectedDate + "T00:00:00");
  const [viewYear, setViewYear] = useState(sel.getFullYear());
  const [viewMonth, setViewMonth] = useState(sel.getMonth()); // 0-11

  const historySet = useMemo(() => new Set(historyDates), [historyDates]);
  const today = todayKey();

  const firstOfMonth = new Date(viewYear, viewMonth, 1);
  const startOffset = firstOfMonth.getDay(); // 0 = Sunday
  const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();

  const cells = [];
  for (let i = 0; i < startOffset; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);

  const goMonth = (delta) => {
    let m = viewMonth + delta, y = viewYear;
    if (m < 0) { m = 11; y -= 1; }
    if (m > 11) { m = 0; y += 1; }
    setViewMonth(m); setViewYear(y);
  };

  const keyFor = (d) => `${viewYear}-${String(viewMonth + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;

  return (
    <Sheet onClose={onClose} title="Jump to a date">
      <div className="flex items-center justify-between mb-3">
        <button onClick={() => goMonth(-1)} className="w-9 h-9 rounded-full flex items-center justify-center active:scale-90" style={{ background: PAPER }}>
          <Icon.chevronL size={16} color={NAVY} />
        </button>
        <p className="font-display font-bold text-sm" style={{ color: NAVY }}>{MONTH_LABEL_FMT(viewYear, viewMonth)}</p>
        <button onClick={() => goMonth(1)} className="w-9 h-9 rounded-full flex items-center justify-center active:scale-90" style={{ background: PAPER }}>
          <Icon.chevronR size={16} color={NAVY} />
        </button>
      </div>

      <div className="grid grid-cols-7 gap-1 mb-1">
        {WEEKDAY_LABELS.map((w, i) => (
          <div key={i} className="text-center text-[10px] font-bold py-1" style={{ color: MUTED }}>{w}</div>
        ))}
      </div>
      <div className="grid grid-cols-7 gap-1 mb-4">
        {cells.map((d, i) => {
          if (d === null) return <div key={i} />;
          const k = keyFor(d);
          const isSelected = k === selectedDate;
          const isToday = k === today;
          const hasEntries = historySet.has(k);
          return (
            <button key={i} onClick={() => onSelect(k)}
              className="aspect-square rounded-full flex flex-col items-center justify-center text-xs font-semibold transition active:scale-90"
              style={isSelected
                ? { background: NAVY, color: "#fff" }
                : isToday
                ? { background: "#E1F3EC", color: TEAL_DARK, border: `1.5px solid ${TEAL}` }
                : { background: "transparent", color: INK }}>
              {d}
              <span className="w-1 h-1 rounded-full mt-0.5" style={{ background: hasEntries && !isSelected ? TEAL : "transparent" }} />
            </button>
          );
        })}
      </div>

      <button onClick={() => onSelect(today)} className="w-full py-2.5 rounded-xl text-sm font-bold" style={{ background: "#E1F3EC", color: TEAL_DARK }}>
        Jump to today
      </button>
    </Sheet>
  );
}

      {showCalendar && (

      )}

  );
}

function DiaryView({ historyDates, entries, onOpen }) {
  return (

      <h2 className="font-display font-bold mb-3 text-lg" style={{ color: NAVY }}>Past entries</h2>
      {historyDates.length === 0 ? (
        <div className="bg-white rounded-2xl p-8 text-center" style={{ border: `1px solid ${LINE}` }}>
          <Icon.calendar size={26} color={NAVY} />
          <p className="text-sm mt-2" style={{ color: MUTED }}>Your logged days will show up here.</p>
        </div>
      ) : (
        <ul className="space-y-2.5">
          {historyDates.map(k => {
            const d = entries[k]; const total = d.tasks.length; const done = d.tasks.filter(t => t.done).length;
            const complete = total > 0 && done === total;
            return (
              <li key={k}>
                <button onClick={() => onOpen(k)} className="w-full bg-white rounded-xl px-4 py-3.5 flex items-center justify-between transition hover:shadow-md" style={{ border: `1px solid ${LINE}` }}>
                  <span className="font-semibold text-sm" style={{ color: INK }}>{prettyDate(k)}</span>
                  <span className="text-xs font-bold px-2.5 py-1 rounded-full" style={{ background: complete ? "#E1F3EC" : "#FBF1DC", color: complete ? TEAL_DARK : "#8A6300" }}>
                    {done}/{total} done {complete ? "✓" : ""}
                  </span>
                </button>
              </li>
            );
          })}
        </ul>
      )}
    </div>
  );
}

function AddTaskSheet({ onClose, onSave, familyCode, activeProfileId }) {

  return (
    <Sheet onClose={onClose} title="Add a task">
      <label className="text-xs font-bold mb-1.5 block uppercase tracking-wide" style={{ color: MUTED }}>Subject</label>
      <div className="flex flex-wrap gap-2 mb-4">
        {["General", ...KNOWN_SUBJECTS].map(s => {
          const st = styleFor(s); const active = subject === s;
          return <button key={s} onClick={() => setSubject(s)} className="text-xs font-bold px-3 py-1.5 rounded-full border-2 transition"

      <label className="text-xs font-bold mb-1.5 block uppercase tracking-wide" style={{ color: MUTED }}>What is it?</label>

function ImportSheet({ onClose, onConfirm, defaultDate }) {
  const [raw, setRaw] = useState("");
  const [parsed, setParsed] = useState(null);
  const [dateKey, setDateKey] = useState(defaultDate);
  const taRef = useRef(null);

  const doParse = () => { if (!raw.trim()) return; setParsed(parseWhatsAppText(raw).map(it => ({ ...it, id: uid(), include: true, done: false }))); };
  const toggleInclude = (id) => setParsed(parsed.map(p => p.id === id ? { ...p, include: !p.include } : p));
  const updateSubject = (id, subject) => setParsed(parsed.map(p => p.id === id ? { ...p, subject } : p));
  const handlePasteClick = async () => {
    try { const clip = await navigator.clipboard.readText(); if (clip) setRaw(clip); } catch { taRef.current?.focus(); }
  };

  return (
    <Sheet onClose={onClose} title="Import from WhatsApp">
      {!parsed ? (
        <>
          <p className="text-xs mb-2 leading-relaxed" style={{ color: MUTED }}>Open your class WhatsApp group, copy the homework/notice message, then paste it below.</p>
          <div className="flex justify-end mb-1">
            <button onClick={handlePasteClick} className="text-xs font-bold flex items-center gap-1" style={{ color: NAVY }}>
              <Icon.clip size={13} /> Paste from clipboard
            </button>
          </div>
          <textarea ref={taRef} value={raw} onChange={(e) => setRaw(e.target.value)} rows={7}
            placeholder={"Example:\nMaths: Do Ex 4.2 Q1-5\nHindi - व्याकरण पेज 20\nPTM on Friday 10am"}
            className="w-full rounded-xl p-3 text-sm mb-4 focus:outline-none" style={{ border: `2px solid ${LINE}` }} />
          <button disabled={!raw.trim()} onClick={doParse} className="w-full py-3.5 rounded-xl text-white font-display font-bold disabled:opacity-40" style={{ background: NAVY }}>
            Split into tasks
          </button>
        </>
      ) : (
        <>
          <p className="text-xs mb-3 leading-relaxed" style={{ color: MUTED }}>Review the tasks below — untick anything that isn't relevant, and fix a subject if needed.</p>
          <div className="mb-3">
            <label className="text-xs font-bold mb-1 block uppercase tracking-wide" style={{ color: MUTED }}>Add to date</label>
            <input type="date" value={dateKey} onChange={(e) => setDateKey(e.target.value)} className="rounded-lg px-3 py-2 text-sm" style={{ border: `2px solid ${LINE}` }} />
          </div>
          <ul className="space-y-2 mb-4 max-h-64 overflow-y-auto pr-1">
            {parsed.map(p => {
              const s = styleFor(p.subject);
              return (
                <li key={p.id} className="rounded-xl p-3 transition" style={{ border: `2px solid ${LINE}`, background: p.include ? "#fff" : "#F5F8F8", opacity: p.include ? 1 : 0.55 }}>
                  <div className="flex items-start gap-2">
                    <button onClick={() => toggleInclude(p.id)} className="w-5 h-5 rounded-md flex items-center justify-center shrink-0 mt-0.5 border-2"
                      style={{ background: p.include ? TEAL : "#fff", borderColor: p.include ? TEAL : "#D5DEDF" }}>
                      {p.include && <Icon.check size={11} color="#fff" />}
                    </button>
                    <div className="flex-1">
                      <select value={p.subject} onChange={(e) => updateSubject(p.id, e.target.value)}
                        className="text-[11px] font-bold rounded-md px-1.5 py-0.5 mb-1 border-0" style={{ background: s.bg, color: s.fg }}>
                        {["General", ...KNOWN_SUBJECTS].map(sub => <option key={sub} value={sub}>{sub}</option>)}
                      </select>
                      <p className="text-sm" style={{ color: INK }}>{p.text}</p>
                    </div>
                  </div>
                </li>
              );
            })}
          </ul>
          <div className="flex gap-2">
            <button onClick={() => setParsed(null)} className="flex-1 py-3.5 rounded-xl font-display font-bold" style={{ background: "#E1F3EC", color: TEAL_DARK }}>Back</button>
            <button onClick={() => onConfirm(parsed.filter(p => p.include).map(({ id, subject, text }) => ({ id, subject, text, done: false })), dateKey)}
              className="flex-[2] py-3.5 rounded-xl text-white font-display font-bold" style={{ background: NAVY }}>
              Add {parsed.filter(p => p.include).length} tasks
            </button>
          </div>
        </>
      )}
    </Sheet>
  );
}

/* ============ Docs tab — shared family documents (forms, notices, etc.) ============ */
function DocsView({ docs, onAdd, onDelete }) {
  return (
    <div>
      <h2 className="font-display font-bold mb-3 text-lg" style={{ color: NAVY }}>Shared Documents</h2>
      <p className="text-xs mb-4" style={{ color: MUTED }}>
        Keep school forms, notices, syllabus copies, and other files here — anything that isn't tied to a single day's homework.
      </p>
      {docs.length === 0 ? (
        <div className="bg-white rounded-2xl p-8 text-center" style={{ border: `1px solid ${LINE}` }}>
          <Icon.folder size={26} color={NAVY} />
          <p className="font-display font-bold mt-3" style={{ color: NAVY }}>No documents yet</p>
          <p className="text-sm mt-1 mb-4" style={{ color: MUTED }}>Upload school forms, notices, or anything worth keeping handy.</p>
          <button onClick={onAdd} className="px-4 py-2.5 rounded-full text-white text-sm font-bold inline-flex items-center gap-1.5" style={{ background: NAVY }}>
            <Icon.plus size={15} /> Add document
          </button>
        </div>
      ) : (
        <ul className="space-y-2.5">
          {docs.map(d => (
            <li key={d.id} className="bg-white rounded-xl px-3 py-3 flex items-center gap-3" style={{ border: `1px solid ${LINE}` }}>
              <span className="text-[10px] font-extrabold px-2 py-1 rounded-md shrink-0" style={{ background: fileBadgeColor(d.kind), color: INK }}>
                {fileBadgeLabel(d.kind)}
              </span>
              <div className="flex-1 min-w-0">
                <p className="text-sm truncate" style={{ color: INK }}>{d.name}</p>
                <AttachmentChip attachment={d} />
              </div>
              <button onClick={() => onDelete(d.id)} className="shrink-0 active:scale-90" style={{ color: "#C7CFD1" }}><Icon.trash size={16} /></button>
            </li>
          ))}
        </ul>
      )}
    </div>
  );
}

function AddDocSheet({ onClose, onSave, familyCode }) {
  const [uploading, setUploading] = useState(false);
  const [error, setError] = useState("");
  const inputRef = useRef(null);

  const handleFile = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    setError("");
    if (file.size > MAX_FILE_MB * 1024 * 1024) { setError(`File is too big (max ${MAX_FILE_MB}MB).`); return; }
    if (!familyCode) { setError("Shared documents need cloud sync to be set up (Supabase). This device is running in local-only mode."); return; }

    setUploading(true);
    try {
      const path = `${familyCode}/docs/${uid()}-${file.name}`;
      const { error: uploadError } = await sb.storage.from(ATTACHMENTS_BUCKET).upload(path, file);
      if (uploadError) throw uploadError;
      const { data } = sb.storage.from(ATTACHMENTS_BUCKET).getPublicUrl(path);
      onSave({ id: uid(), name: file.name, url: data.publicUrl, type: file.type, size: file.size, kind: fileKind(file.type, file.name) });
    } catch (err) {
      console.error("Document upload failed:", err);
      setError(`Upload failed — ${err.message || "check your Supabase Storage setup"}.`);
    }
    setUploading(false);
  };

  return (
    <Sheet onClose={onClose} title="Add a document">
      <p className="text-xs mb-3" style={{ color: MUTED }}>
        Photos, PDFs, Word or Excel files — anything the whole family might need to find again later.
      </p>
      <input ref={inputRef} type="file" accept={ACCEPTED_FILE_TYPES} onChange={handleFile} className="hidden" />
      <button onClick={() => inputRef.current?.click()} disabled={uploading}
        className="w-full py-6 rounded-xl text-sm font-bold flex flex-col items-center justify-center gap-2 disabled:opacity-50"
        style={{ background: "#F5F8F8", color: NAVY, border: `1.5px dashed ${LINE}` }}>
        <Icon.paperclip size={20} />
        {uploading ? "Uploading…" : "Choose a file to upload"}
      </button>
      {error && <p className="text-[11px] mt-2" style={{ color: "#B7551E" }}>{error}</p>}
    </Sheet>
  );
}


function ProfileSheet({ profile, onClose, onSave, dismissable = true }) {
  const [name, setName] = useState(profile?.name || "");
  const [className, setClassName] = useState(profile?.className || "1");
  const [section, setSection] = useState(profile?.section || "");
  return (
    <Sheet onClose={onClose} title={profile ? "Edit profile" : "Add a student"} dismissable={dismissable}>
      {!profile && <div className="flex justify-center mb-4"><Emblem size={56} /></div>}
      <label className="text-xs font-bold mb-1.5 block uppercase tracking-wide" style={{ color: MUTED }}>Student name</label>
      <input value={name} onChange={(e) => setName(e.target.value)} placeholder="Student's name"
        className="w-full rounded-xl p-3 text-sm mb-4 focus:outline-none" style={{ border: `2px solid ${LINE}` }} />
      <label className="text-xs font-bold mb-1.5 block uppercase tracking-wide" style={{ color: MUTED }}>Class</label>
      <div className="grid grid-cols-5 gap-2 mb-4">
        {Array.from({ length: 10 }, (_, i) => String(i + 1)).map(c => (
          <button key={c} onClick={() => setClassName(c)} className="py-2 rounded-lg text-sm font-bold border-2 transition"
            style={className === c ? { background: NAVY, color: "#fff", borderColor: NAVY } : { background: "#fff", color: NAVY, borderColor: LINE }}>{c}</button>
        ))}
      </div>
      <label className="text-xs font-bold mb-1.5 block uppercase tracking-wide" style={{ color: MUTED }}>Section (optional)</label>
      <input value={section} onChange={(e) => setSection(e.target.value.toUpperCase().slice(0, 1))} placeholder="e.g. A"
        className="w-full rounded-xl p-3 text-sm mb-4 focus:outline-none" style={{ border: `2px solid ${LINE}` }} />
      <button disabled={!name.trim()} onClick={() => onSave({ name: name.trim(), className, section: section.trim() })}
        className="w-full py-3.5 rounded-xl text-white font-display font-bold disabled:opacity-40" style={{ background: NAVY }}>
        {profile ? "Save changes" : "Add student"}
      </button>
    </Sheet>
  );
}

function ProfileSwitcherSheet({ profiles, activeProfileId, onSelect, onAdd, onEdit, onClose, familyCode, onChangeFamily }) {
  return (
    <Sheet onClose={onClose} title="Students">
      <ul className="space-y-2 mb-4">
        {profiles.map(p => (
          <li key={p.id} className="flex items-center gap-3 p-2.5 rounded-xl" style={{ border: `1px solid ${LINE}`, background: p.id === activeProfileId ? "#F5F8F8" : "#fff" }}>
            <button onClick={() => onSelect(p.id)} className="flex items-center gap-3 flex-1 text-left">
              <Avatar name={p.name} color={p.color} size={40} ring={p.id === activeProfileId} />
              <div>
                <p className="font-display font-bold text-sm" style={{ color: INK }}>{p.name}</p>
                <p className="text-xs" style={{ color: MUTED }}>Class {p.className}{p.section ? `-${p.section}` : ""}</p>
              </div>
            </button>
            <button onClick={() => onEdit(p)} className="text-xs font-bold px-2 py-1" style={{ color: TEAL_DARK }}>Edit</button>
          </li>
        ))}
      </ul>
      <button onClick={onAdd} className="w-full py-3 rounded-xl font-display font-bold flex items-center justify-center gap-1.5 mb-3" style={{ background: "#E1F3EC", color: TEAL_DARK }}>
        <Icon.plus size={16} /> Add another student
      </button>
      {familyCode && (
        <div className="pt-3" style={{ borderTop: `1px solid ${LINE}` }}>
          <p className="text-[11px] mb-2" style={{ color: MUTED }}>Family code: <span className="font-bold" style={{ color: INK }}>{familyCode}</span> — enter this on another device to see the same diary there.</p>
          <button onClick={onChangeFamily} className="text-[11px] font-bold" style={{ color: "#B7551E" }}>Disconnect this device</button>
        </div>
      )}
    </Sheet>
  );
}
